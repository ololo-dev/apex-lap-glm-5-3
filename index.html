<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oxbow Ring — Vantor GT-12</title>
    <style>
      :root {
        --ink: #eef2f6;
        --panel: rgba(10, 14, 20, 0.74);
        --accent: #ff6a1a;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
      body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
      .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 10px 14px;
        backdrop-filter: blur(6px);
      }
      #timing { top: 16px; left: 16px; min-width: 230px; }
      #timing .trackname, #standings .trackname, #results .trackname {
        font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--accent); margin-bottom: 6px; font-weight: 700;
      }
      #timing .row { display: flex; justify-content: space-between; gap: 18px; font-size: 14px; line-height: 1.55; }
      #timing .row b { font-family: var(--mono); font-weight: 600; }
      #timing .row .label { opacity: 0.55; font-size: 12px; letter-spacing: 0.08em; }
      #speed { bottom: 18px; left: 50%; transform: translateX(-50%); text-align: center; padding: 8px 22px; }
      #speed b { font-family: var(--mono); font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
      #speed small { display: block; font-size: 11px; letter-spacing: 0.3em; opacity: 0.6; margin-top: -4px; }
      #standings { top: 16px; right: 16px; min-width: 190px; padding: 10px 12px; }
      #standings .srow { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.9; }
      #standings .srow span:first-child { width: 14px; opacity: 0.6; font-family: var(--mono); }
      #standings .srow i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      #standings .srow .nm { flex: 1; white-space: nowrap; }
      #standings .srow .st { opacity: 0.55; font-family: var(--mono); font-size: 12px; }
      #standings .srow.me { color: #ffd166; }
      #countdown {
        position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
        font-size: 150px; font-weight: 800; color: #fff;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.55); transition: opacity 0.3s; opacity: 0;
      }
      #results {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: min(430px, 92vw); pointer-events: auto;
      }
      #results table { border-collapse: collapse; width: 100%; font-size: 15px; }
      #results th { font-size: 11px; letter-spacing: 0.14em; opacity: 0.55; text-align: left; padding: 4px 8px; }
      #results th.num, #results td.num { text-align: right; font-family: var(--mono); }
      #results td { padding: 7px 8px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      #results td i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 9px; }
      #results tr.me td { color: #ffd166; font-weight: 700; }
      #results .newrace { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
      #results .newrace span { font-size: 12px; opacity: 0.6; }
      #newrace {
        font: inherit; font-weight: 700; letter-spacing: 0.12em; color: #0b0e14;
        background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
      }
      #newrace:hover { filter: brightness(1.1); }
      @media (max-width: 600px) {
        #timing { transform: scale(0.78); transform-origin: top left; }
        #standings { transform: scale(0.78); transform-origin: top right; }
        #speed b { font-size: 32px; }
        #results table { font-size: 12px; }
        #results .trackname { font-size: 9px; }
        #controls { display: none; }
        #countdown { font-size: 96px; }
      }
      #alerts { position: absolute; top: 230px; right: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .badge {
        font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
        padding: 7px 12px; border-radius: 8px; background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #offroad { color: #ffd166; border-color: #ffd16655; }
      #wrongway { color: #ff5d5d; border-color: #ff5d5d66; display: none; }
      #demo { color: #7ee0ff; border-color: #7ee0ff44; display: none; }
      #flash {
        position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
        font-size: 30px; font-weight: 800; letter-spacing: 0.04em;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); opacity: 0; transition: opacity 0.25s;
      }
      #controls {
        position: absolute; bottom: 16px; left: 16px; font-size: 12px;
        opacity: 0.55; line-height: 1.7;
      }
      kbd {
        font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,0.12);
        border-radius: 4px; padding: 1px 5px; margin: 0 1px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
